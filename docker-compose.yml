services:
  studio:
    build:
      context: .
      target: runtime
    image: vit-studio
    container_name: vit-studio
    ports:
      # Loopback only: the Studio has no auth, so don't expose it to the network.
      - "127.0.0.1:8765:8765"
    volumes:
      # The demo git repo + imported media survive container restarts.
      - vit-workspace:/data
    environment:
      # Add host names here (comma-separated) if you reach the Studio by another name.
      VIT_ALLOWED_HOSTS: ""
    restart: unless-stopped

volumes:
  vit-workspace:
